name: Deploy Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Check types
        run: npx tsc --noEmit

      - name: Build site
        run: npm run build

      - name: Deploy production
        run: >-
          npx wrangler@4.118.0 pages deploy dist
          --project-name workstation-fit
          --branch main
          --commit-hash "$GITHUB_SHA"
          --commit-message "$GITHUB_COMMIT_MESSAGE"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual deployment' }}
