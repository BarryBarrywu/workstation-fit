map $uri $workstation_fit_cache_control {
    default "no-cache";
    ~^/(?:_astro|models)/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    server_name fit.barrybarrywu.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/fit.barrybarrywu.cn/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fit.barrybarrywu.cn;

    root /var/www/fit.barrybarrywu.cn/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/fit.barrybarrywu.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fit.barrybarrywu.cn/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Cache-Control $workstation_fit_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location ^~ /_astro/ {
        try_files $uri =404;
    }

    location ^~ /models/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
