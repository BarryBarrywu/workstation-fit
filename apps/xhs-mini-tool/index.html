<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2ec" />
    <title>就位</title>
    <link rel="stylesheet" href="./assets/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="brand-bar">
        <img src="./assets/icon.png" alt="" width="42" height="42" />
        <div><strong>就位</strong><span>按身高，调桌椅与显示器</span></div>
      </header>
      <section class="welcome-card" aria-labelledby="welcome-title">
        <p class="eyebrow">工位调节起点</p>
        <h1 id="welcome-title">先确认你的身高</h1>
        <p class="lede">得到宽松的调节起点，再用脚掌、手肘和视线确认真实位置。</p>
        <form id="height-form" novalidate>
          <label for="height-input">身高（厘米）</label>
          <div class="height-control">
            <input id="height-input" name="height" type="text" inputmode="decimal" autocomplete="off" placeholder="例如 173" />
            <span aria-hidden="true">cm</span>
          </div>
          <p id="height-error" class="field-error" role="alert"></p>
          <button class="primary-button" type="submit">查看调节起点</button>
        </form>
        <aside class="privacy-note" aria-label="本地隐私说明">
          <strong>只留在本地</strong>
          <p>身高和检查进度只保存在这个小工具里，不会上传、没有账号记录，也可能在小红书清理本地数据后消失。</p>
        </aside>
      </section>
      <div id="fit-app" aria-live="polite"></div>
      <footer id="build-meta" class="build-meta"></footer>
    </main>
    <script src="./assets/main.js"></script>
  </body>
</html>
